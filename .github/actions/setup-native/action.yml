name: Set up native Swift validation
description: Verify and reuse pinned Swift distributions with scoped native prerequisites.
inputs:
  profile:
    description: Build/compiler or runtime/test-consumer prerequisites; both install verified Swift.
    default: build

runs:
  using: composite
  steps:
    # Every caller caps this entire action at ten minutes, including cache I/O.
    - name: Plan exact compiler cache and start the provisioning deadline
      id: provisioning
      if: runner.os != 'Windows'
      shell: bash
      env:
        DISCORDKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        NATIVE_PROFILE: ${{ inputs.profile }}
      run: |
        case "$NATIVE_PROFILE" in
          build|runtime) ;;
          *) echo 'Unknown native prerequisite profile' >&2; exit 1 ;;
        esac
        python3 Tools/ci/native_provisioning.py prepare --platform auto \
          --root "$RUNNER_TEMP/native-provisioning" \
          --output "$RUNNER_TEMP/native-provisioning-plan.json" \
          --github-output "$GITHUB_OUTPUT" --github-env "$GITHUB_ENV"
    - uses: actions/setup-python@v6
      if: runner.os != 'Linux'
      with:
        python-version: '3.12'
    - name: Install scoped Ubuntu prerequisites within the provisioning deadline
      if: runner.os == 'Linux'
      shell: bash
      env:
        NATIVE_PROFILE: ${{ inputs.profile }}
      run: |
        case "$NATIVE_PROFILE" in
          build|runtime) ;;
          *) echo 'Unknown native prerequisite profile' >&2; exit 1 ;;
        esac
        # SwiftPM can compile manifests even with --skip-build. Retain its
        # compiler/linker headers and CRT dependencies in the runtime profile.
        packages=(binutils ca-certificates curl git gnupg2 libc6-dev libcurl4t64
          libedit2 libgcc-13-dev libpython3.12t64 libsqlite3-0 libstdc++-13-dev
          libxml2 libz3-4 linux-libc-dev python3 python3.12 tzdata unzip zlib1g)
        if [[ "$NATIVE_PROFILE" == build ]]; then
          packages+=(clang libcurl4-openssl-dev
            libncurses-dev libpython3-dev libxml2-dev
            libz3-dev pkg-config zlib1g-dev)
        fi
        python3 Tools/ci/native_provisioning.py run \
          --plan "$RUNNER_TEMP/native-provisioning-plan.json" --name apt-update \
          -- sudo apt-get update
        python3 Tools/ci/native_provisioning.py run \
          --plan "$RUNNER_TEMP/native-provisioning-plan.json" --name apt-install \
          -- sudo apt-get install --yes --no-install-recommends "${packages[@]}"
        # Native dependency observations must use Ubuntu's packaged libpython.
        # Hosted Python adds an unowned library directory to LD_LIBRARY_PATH.
        native_python_bin="$RUNNER_TEMP/native-python/bin"
        mkdir -p "$native_python_bin"
        ln -sfn /usr/bin/python3.12 "$native_python_bin/python"
        ln -sfn /usr/bin/python3.12 "$native_python_bin/python3"
        echo "$native_python_bin" >> "$GITHUB_PATH"
    - name: Restore only the exact signed compiler distribution
      id: swift-cache
      if: runner.os != 'Windows'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.provisioning.outputs.cache-path }}
        key: ${{ steps.provisioning.outputs.cache-key }}
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
    - name: Authenticate compiler bytes before installation and execution
      if: runner.os != 'Windows'
      shell: bash
      env:
        SWIFT_CACHE_HIT: ${{ steps.swift-cache.outputs.cache-hit }}
      run: >-
        python Tools/ci/native_provisioning.py provision
        --plan "$RUNNER_TEMP/native-provisioning-plan.json"
        --cache-hit "$SWIFT_CACHE_HIT" --github-path "$GITHUB_PATH"
        --github-env "$GITHUB_ENV"
    - name: Save verified payload only from the trusted default branch
      if: runner.os != 'Windows' && steps.provisioning.outputs.cache-save == 'true' && steps.swift-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.provisioning.outputs.cache-path }}
        key: ${{ steps.provisioning.outputs.cache-key }}
    - name: Retain provisioning identity and bounded diagnostics
      if: always() && runner.os != 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: provisioning-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/native-provisioning/evidence
        if-no-files-found: warn
        retention-days: 14
    - name: Enable Windows developer mode and require native build prerequisites
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force
        New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
        New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'MSVC x64 build tools are required' }
        $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory | Where-Object { $_.Name -match '^10\.0\.\d+\.0$' -and [version]$_.Name -ge [version]'10.0.22000.0' }
        if (-not $sdk) { throw 'Windows SDK 10.0.22000 or newer is required' }
    - name: Install Swift 6.4.1 on Windows
      if: runner.os == 'Windows'
      uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
      with:
        swift-version: swift-6.4.1-release
        swift-build: 6.4.1-RELEASE
        build_arch: amd64
