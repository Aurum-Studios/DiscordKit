name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

defaults:
  run:
    shell: bash

env:
  SWIFTNIO_STRICT: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  platform:
    name: Platform checks / macos-arm64
    runs-on:
      group: MacOS-26-5
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
      - name: Check native host, compiler, linker and runtime
        run: >-
          python Tools/ci/platform_probe.py --platform macos-arm64
          --output .build/documentation-ci/platform
      - name: Retain documentation platform evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-platform-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/documentation-ci/platform
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  build:
    name: Documentation builds / macos-arm64 / ${{ matrix.component }}
    needs: platform
    runs-on:
      group: MacOS-26-5
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        component: [root, macros, extensions]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
      - name: Compile package and emit normalized public symbol graphs
        run: >-
          python Tools/ci/native_jobs.py compile --component ${{ matrix.component }}
          --platform macos-arm64 --jobs 5
          --output .build/documentation-ci/build-${{ matrix.component }}
          --archive "${{ runner.temp }}/compiled/macos-arm64-${{ matrix.component }}.tar.gz"
      - name: Verify generated source and dependency pins remain unchanged
        run: git diff --exit-code
      - name: Share this attempt's compiled package and public graphs
        uses: actions/upload-artifact@v7
        with:
          name: documentation-compiled-macos-arm64-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compiled/macos-arm64-${{ matrix.component }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Retain documentation build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-build-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/documentation-ci/build-${{ matrix.component }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  helpers:
    name: Documentation helper suites / linux-x64
    needs: build
    runs-on:
      group: Linux-x64-8
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-artifact-sdk
      - name: Test documentation and artifact helpers without a compiler
        run: |
          mkdir -p .build/documentation-ci/helpers
          python -m unittest discover -s Tools/ci -p 'test_*.py' 2>&1 | tee .build/documentation-ci/helpers/tests.log
      - name: Retain helper diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-helpers-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/documentation-ci/helpers
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  site:
    name: Convert public DocC and export website / macos-arm64
    needs: build
    runs-on:
      group: MacOS-26-5
    timeout-minutes: 60
    env:
      DOCUMENTATION_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
      - name: Download this attempt's documentation compilations
        uses: actions/download-artifact@v8
        with:
          pattern: documentation-compiled-macos-arm64-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compiled
          merge-multiple: true
      - name: Verify and restore all three compiled packages
        run: |
          for component in root macros extensions; do
            python Tools/ci/native_jobs.py restore --component "$component" --platform macos-arm64 \
              --archive "$RUNNER_TEMP/compiled/macos-arm64-$component.tar.gz" \
              --output ".build/documentation-ci/restore-$component"
          done
      - name: Check public documentation and export static routes without recompiling
        run: |
          mkdir -p .build/documentation-ci/site
          python Tools/ci/build_documentation_site.py --skip-symbol-graphs \
            --hosting-base-path "$DOCUMENTATION_BASE_PATH" 2>&1 | tee .build/documentation-ci/site/conversion.log
      - name: Verify documentation and dependency pins remain unchanged
        run: git diff --exit-code
      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          name: documentation-pages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/documentation-site
          retention-days: 7
          include-hidden-files: true
      - name: Retain documentation conversion and restore diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/documentation-ci
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  deploy:
    name: Publish GitHub Pages
    needs: [site, helpers]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on:
      group: Linux-x64-8
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: documentation-pages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
