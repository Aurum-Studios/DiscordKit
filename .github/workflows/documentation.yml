name: Documentation

# A manual standalone request obtains the normal CI producers. Automatic pushes
# and PRs prepare their site in ci.yml and never start another compilation graph.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Pages only after trusted default-branch full certification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  request:
    name: Request full CI with shared documentation inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Request the ordinary contained full certification path
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SELECTED_REF: ${{ github.ref_name }}
          PUBLISH_DOCUMENTATION: ${{ inputs.publish }}
        run: >-
          timeout 120 gh workflow run ci.yml --ref "$SELECTED_REF"
          -f mode=full -f publish-documentation="$PUBLISH_DOCUMENTATION"
