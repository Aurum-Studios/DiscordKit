name: Offline certification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Full certification, cheap preflight, or one scoped diagnostic
        type: choice
        options: [preflight, diagnostic, full]
        default: preflight
      publish-documentation:
        description: Publish Pages after trusted default-branch full certification
        type: boolean
        default: false
      qualification-fault:
        description: Fail the first Linux DiscordBitsTests consumer after tests for a bounded partial-rerun proof
        type: boolean
        default: false
      platform:
        description: Diagnostic platform (leave empty for full/preflight)
        type: string
      component:
        description: Diagnostic component (leave empty for full/preflight)
        type: string
      suite:
        description: Optional diagnostic suite; omitted selects only its producer plus the load canary
        type: string

permissions:
  contents: read
  actions: read

# Full runs supersede only full runs. A diagnostic cannot cancel certification.
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode || 'preflight' }}-${{ inputs.platform || 'all' }}-${{ inputs.component || 'all' }}-${{ inputs.suite || 'all' }}-${{ inputs.qualification-fault || false }}
  cancel-in-progress: true

env:
  SWIFTNIO_STRICT: '1'
  PYTHONUNBUFFERED: '1'
  ADMISSION_MODE: ${{ inputs.mode || 'preflight' }}
  ADMISSION_PLATFORM: ${{ inputs.platform }}
  ADMISSION_COMPONENT: ${{ inputs.component }}
  ADMISSION_SUITE: ${{ inputs.suite }}
  ADMISSION_PUBLICATION: ${{ inputs.publish-documentation || false }}
  ADMISSION_QUALIFICATION_FAULT: ${{ inputs.qualification-fault || false }}
  ADMISSION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  scope:
    name: Validate scope and contained rollout
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      native-enabled: ${{ steps.scope.outputs.native-enabled }}
      admitted: ${{ steps.scope.outputs.admitted }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate all selections before scheduling
        id: scope
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'preflight' }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
          SELECTED_COMPONENT: ${{ inputs.component }}
          SELECTED_SUITE: ${{ inputs.suite }}
        run: >-
          python3 Tools/ci/spend_admission.py plan --mode "$REQUESTED_MODE"
          --platform "$SELECTED_PLATFORM" --component "$SELECTED_COMPONENT" --suite "$SELECTED_SUITE"
          --output .build/spend/plan.json

      - name: Summarize the bounded plan and rejected admission
        if: always()
        run: python3 Tools/ci/usage_report.py --plan .build/spend/plan.json --output .build/spend/usage.json
      - name: Retain admitted plan and bootstrap usage
        if: steps.scope.outputs.admitted == 'true'
        uses: ./.github/actions/upload-evidence
        with:
          name: spend-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          paths: .build/spend
          retention-days: 14
          receipt: ${{ runner.temp }}/spend-plan-transfer.json

  source:
    name: Source policy and workflow syntax
    needs: scope
    if: needs.scope.outputs.admitted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check current-attempt spend reservation
        id: admission
        env:
          ADMISSION_JOB: source
          ADMISSION_GROUP: ubuntu-24.04
        run: >-
          python3 Tools/ci/spend_admission.py guard --job "$ADMISSION_JOB" --group "$ADMISSION_GROUP"
          --output .build/spend/guard.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned actionlint with verified release checksum
        run: |
          curl --fail --location --retry 0 --max-time 120 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate source-only policy and documentation snapshots
        run: python3 Tools/ci/preflight.py source --output .build/preflight/source
      - name: Validate workflow syntax and action expressions
        run: python3 Tools/ci/preflight.py workflow --output .build/preflight/workflow
      - name: Require unchanged generated source and pins
        run: git diff --exit-code

  helpers:
    name: Helper suites / ${{ matrix.group }}
    needs: scope
    if: needs.scope.outputs.admitted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [ci-python, tooling-python, benchmark-python, browser]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check current-attempt spend reservation
        id: admission
        env:
          ADMISSION_JOB: helpers/${{ matrix.group }}
          ADMISSION_GROUP: ubuntu-24.04
        run: >-
          python3 Tools/ci/spend_admission.py guard --job "$ADMISSION_JOB" --group "$ADMISSION_GROUP"
          --output .build/spend/guard.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        if: matrix.group == 'browser' || matrix.group == 'ci-python'
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-artifact-sdk
        if: matrix.group == 'ci-python'
      - name: Run bounded balanced helper group
        run: python3 Tools/ci/preflight.py group --group ${{ matrix.group }} --output .build/preflight/${{ matrix.group }}
      - name: Require unchanged generated source and pins
        run: git diff --exit-code

  maintenance:
    name: Upstream maintenance review freshness
    needs: scope
    if: needs.scope.outputs.admitted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check current-attempt spend reservation
        id: admission
        env:
          ADMISSION_JOB: maintenance
          ADMISSION_GROUP: ubuntu-24.04
        run: >-
          python3 Tools/ci/spend_admission.py guard --job "$ADMISSION_JOB" --group "$ADMISSION_GROUP"
          --output .build/spend/guard.json
      - name: Require a current upstream review for certification
        run: python3 Tools/DiscordKitTools/scripts/release_check.py maintenance --repository . --record Docs/Release/maintenance.json

  # Both platform groups remain visible and depend only on shared cheap checks.
  native-linux:
    name: Linux x64
    needs: [scope, source, helpers, maintenance]
    if: needs.scope.outputs.native-enabled == 'true' && (needs.scope.outputs.mode == 'full' || inputs.platform == 'linux-x64')
    uses: ./.github/workflows/native-platform.yml
    with:
      mode: ${{ needs.scope.outputs.mode }}
      component: ${{ inputs.component || '' }}
      suite: ${{ inputs.suite || '' }}
      platform: linux-x64
      runner-group: Linux-x64-8
      jobs: 2
      build-group: Linux-x64-64
      build-jobs: 2
      shell: bash
      publication: ${{ inputs.publish-documentation || false }}
      qualification-fault: ${{ inputs.qualification-fault || false }}

  native-macos:
    name: macOS ARM64
    needs: [scope, source, helpers, maintenance]
    if: needs.scope.outputs.native-enabled == 'true' && (needs.scope.outputs.mode == 'full' || inputs.platform == 'macos-arm64')
    uses: ./.github/workflows/native-platform.yml
    with:
      mode: ${{ needs.scope.outputs.mode }}
      component: ${{ inputs.component || '' }}
      suite: ${{ inputs.suite || '' }}
      platform: macos-arm64
      runner-group: MacOS-26-5
      jobs: 2
      build-group: MacOS-26-5
      build-jobs: 2
      shell: bash
      publication: ${{ inputs.publish-documentation || false }}
      qualification-fault: ${{ inputs.qualification-fault || false }}

  documentation-site:
    name: Documentation site from validated archives
    needs: [scope, native-macos]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.native-macos.result == 'success' && needs.scope.outputs.mode == 'full' }}
    runs-on:
      group: MacOS-26-5
    timeout-minutes: 65
    outputs:
      artifact: ${{ steps.site.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check current-attempt spend reservation
        id: admission
        env:
          ADMISSION_JOB: documentation-site
          ADMISSION_GROUP: MacOS-26-5
        run: >-
          python3 Tools/ci/spend_admission.py guard --job "$ADMISSION_JOB" --group "$ADMISSION_GROUP"
          --output .build/spend/guard.json
      - uses: ./.github/actions/setup-native
        timeout-minutes: 10
        with:
          profile: runtime
      - name: Prepare documentation site from sealed conversions
        env:
          GH_TOKEN: ${{ github.token }}
          DOCUMENTATION_INPUTS: ${{ needs.native-macos.outputs.documentation-inputs }}
          DOCUMENTATION_BASE_PATH: /${{ github.event.repository.name }}
        run: >-
          python3 Tools/ci/documentation_workflow.py prepare-site
          --hosting-base-path "$DOCUMENTATION_BASE_PATH"
      - name: Require unchanged source and dependency pins
        run: git diff --exit-code
      - name: Share the prepared site with a separate publication consumer
        uses: ./.github/actions/upload-evidence
        with:
          name: documentation-site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          paths: .build/documentation-site.tar.gz
          retention-days: 7
          receipt: ${{ runner.temp }}/documentation-site-transfer.json
      - name: Expose this nonmatrix immutable site identity
        id: site
        run: python3 Tools/ci/documentation_workflow.py artifact-output --receipt "$RUNNER_TEMP/documentation-site-transfer.json"
      - name: Retain site preparation diagnostics even on failure
        if: always() && steps.admission.outcome == 'success'
        uses: ./.github/actions/upload-evidence
        with:
          name: documentation-site-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          paths: .build/documentation-ci/site
          retention-days: 14
          receipt: ${{ runner.temp }}/documentation-site-diagnostics-transfer.json

  complete:
    # Only a validated full request ever creates the required check context.
    name: ${{ needs.scope.outputs.mode == 'full' && 'Offline certification passed' || needs.scope.outputs.mode == 'diagnostic' && 'Diagnostic scope passed' || 'Preflight scope passed' }}
    if: always()
    needs: [scope, source, helpers, maintenance, native-linux, native-macos, documentation-site]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check current-attempt spend reservation
        id: admission
        env:
          ADMISSION_JOB: complete
          ADMISSION_GROUP: ubuntu-24.04
        run: >-
          python3 Tools/ci/spend_admission.py guard --job "$ADMISSION_JOB" --group "$ADMISSION_GROUP"
          --output .build/spend/guard.json
      - uses: ./.github/actions/setup-artifact-sdk
        if: needs.scope.outputs.mode == 'full'
      - name: Verify full scope and complete coverage
        if: needs.scope.outputs.mode == 'full'
        env:
          RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          COVERAGE: '{"linux-x64":${{ needs.native-linux.outputs.coverage || ''null'' }},"macos-arm64":${{ needs.native-macos.outputs.coverage || ''null'' }}}'
        run: python3 Tools/ci/workflow_scope.py verify-full --output .build/full-certification.json
      - name: Verify selected scoped result
        if: needs.scope.outputs.mode != 'full'
        env:
          RESULTS: ${{ toJSON(needs) }}
          MODE: ${{ needs.scope.outputs.mode }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          required = {'scope', 'source', 'helpers', 'maintenance'}
          if os.environ['MODE'] == 'diagnostic':
              required.add('native-linux' if os.environ['SELECTED_PLATFORM'] == 'linux-x64' else 'native-macos')
          if os.environ['MODE'] not in ('preflight', 'diagnostic') or any(results[key]['result'] != 'success' for key in required):
              raise SystemExit('Scoped CI incomplete: ' + json.dumps(results, sort_keys=True))
          PY
      - name: Retain fresh full certification evidence
        if: always() && steps.admission.outcome == 'success' && needs.scope.outputs.mode == 'full'
        uses: ./.github/actions/upload-evidence
        with:
          name: full-coverage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          paths: .build/full-*.json
          retention-days: 14
          receipt: ${{ runner.temp }}/full-coverage-transfer.json

      - name: Summarize refused admission without provisioning
        if: always() && steps.admission.outcome != 'success'
        run: |
          python3 Tools/ci/spend_admission.py plan --output .build/spend/plan.json
          python3 Tools/ci/usage_report.py --plan .build/spend/plan.json --output .build/spend/usage.json
      - name: Reconcile observed attempts against the exact plan
        if: always() && steps.admission.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Tools/ci/spend_admission.py plan --output .build/spend/plan.json
          python3 Tools/ci/usage_report.py --plan .build/spend/plan.json --github --receipts .build --receipts "$RUNNER_TEMP" --output .build/spend/usage.json
      - name: Retain usage and admission evidence
        if: always() && steps.admission.outcome == 'success' && needs.scope.outputs.admitted == 'true'
        uses: ./.github/actions/upload-evidence
        with:
          name: spend-usage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          paths: .build/spend
          retention-days: 14
          receipt: ${{ runner.temp }}/spend-usage-transfer.json

  publish-documentation:
    name: Publish GitHub Pages
    needs: [scope, complete, documentation-site]
    if: >-
      ${{ !cancelled() && inputs.publish-documentation && needs.scope.outputs.mode == 'full' &&
      needs.scope.result == 'success' && needs.complete.result == 'success' &&
      needs.documentation-site.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'Aurum-Studios/DiscordKit' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check current-attempt spend reservation
        id: admission
        env:
          ADMISSION_JOB: publish-documentation
          ADMISSION_GROUP: ubuntu-24.04
        run: >-
          python3 Tools/ci/spend_admission.py guard --job "$ADMISSION_JOB" --group "$ADMISSION_GROUP"
          --output .build/spend/guard.json
      - name: Download and authorize the exact immutable site
        env:
          GH_TOKEN: ${{ github.token }}
          DOCUMENTATION_SITE: ${{ needs.documentation-site.outputs.artifact }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          site = json.loads(os.environ['DOCUMENTATION_SITE'])
          subprocess.run([sys.executable, 'Tools/ci/artifact_transfer.py', 'download',
                          '--artifact-id', site['id'], '--expected-digest', site['digest'],
                          '--destination', '.build/documentation-download',
                          '--receipt', '.build/documentation-download.json'], check=True)
          subprocess.run([sys.executable, 'Tools/ci/documentation_publication.py',
                          '--artifact-id', site['id'], '--artifact-digest', site['digest'],
                          '--artifact-name', site['name'], '--producer-attempt', site['producerAttempt'],
                          '--mode', 'full', '--output', '.build/documentation-publication.json',
                          '--site-archive', '.build/documentation-download/documentation-site.tar.gz',
                          '--site-output', '.build/documentation-publish'], check=True)
          PY
      - name: Upload GitHub Pages site after full certification and authorization
        uses: actions/upload-pages-artifact@v5
        with:
          name: documentation-pages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/documentation-publish
          retention-days: 7
          include-hidden-files: true
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: documentation-pages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
