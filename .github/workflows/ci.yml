name: Offline certification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTNIO_STRICT: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  # Separate callers give each platform its own group in GitHub's job viewer.
  # No platform depends on another platform's pipeline.
  native-linux:
    name: Linux x64
    uses: ./.github/workflows/native-platform.yml
    with:
      platform: linux-x64
      runner-group: Linux-x64-8
      jobs: 8
      build-group: Linux-x64-64
      build-jobs: 64
      shell: bash

  native-macos:
    name: macOS ARM64
    uses: ./.github/workflows/native-platform.yml
    with:
      platform: macos-arm64
      runner-group: MacOS-26-5
      jobs: 5
      build-group: MacOS-26-5
      build-jobs: 5
      shell: bash

  helpers:
    name: Helper suites / ${{ matrix.suite }}
    runs-on:
      group: Linux-x64-8
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: tooling-python
            directory: Tools/DiscordKitTools/scripts
          - suite: load-python
            directory: Tools/DiscordKitLoadTests/scripts
          - suite: benchmarks-python
            directory: Tools/DiscordDSLBenchmarks/scripts
          - suite: ci-python
            directory: Tools/ci
          - suite: browser
            directory: Browser/DiscordActivityBridge
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run selected Python suite
        if: matrix.suite != 'browser'
        run: python -m unittest discover -s ${{ matrix.directory }} -p 'test_*.py'
      - name: Run browser bridge suite
        if: matrix.suite == 'browser'
        run: node --test Browser/DiscordActivityBridge/*.test.mjs

  maintenance:
    name: Upstream maintenance review freshness
    runs-on:
      group: Linux-x64-8
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require a current upstream review for certification
        run: python3 Tools/DiscordKitTools/scripts/release_check.py maintenance --repository . --record Docs/Release/maintenance.json

  complete:
    name: Offline certification passed
    if: always()
    needs: [native-linux, native-macos, helpers, maintenance]
    runs-on:
      group: Linux-x64-8
    timeout-minutes: 5
    steps:
      - name: Require every platform, build and suite to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if failed:
              raise SystemExit('Certification incomplete: ' + json.dumps(failed, sort_keys=True))
          PYTHON
      - name: Record qualification scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          Linux x64 and macOS ARM64 each run their own platform check, builds, suites, validation and source export. A failed or unfinished platform cannot block another platform. Builds use the large Linux pools and the available macOS ARM pool. Independent suites reuse this run's compiled artifacts on small pools; compiler fixtures retain large runners. Shared helper and maintenance checks remain required for complete certification.

          Apple device/simulator jobs compile selected modules only. Android, physical devices, native routing, minimum-OS runtime, authorized Discord, independent crypto review and fleet capacity remain separate gates. Live REST smoke is manual and read-only. No job receives Discord credentials.
          REPORT
